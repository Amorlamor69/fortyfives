  <div class="paper" style="display:flex;flex-direction:column;gap:16px">
    <div><div class="eyebrow">${info.who}</div><h2>${info.title}</h2><p class="soft" style="margin-top:4px">${info.desc} Seats set to Person share this device: the game hides each hand until that player taps in.</p></div>
    ${st.mode === 'cutthroat' ? `<div class="row"><span style="font-weight:700">Players</span><span class="seg"><button class="${st.n===3?'on':''}" data-act="ctn" data-v="3">3</button><button class="${st.n===4?'on':''}" data-act="ctn" data-v="4">4</button><button class="${st.n===5?'on':''}" data-act="ctn" data-v="5">5</button></span></div>` : ''}
    <div class="seats">${rows}</div>
    ${allOpen() ? `<div class="row">${venueSelect('svenue')}</div>` : ''}
    <div class="row"><button class="btn paperbtn" data-act="startsetup">Deal the cards</button><span class="soft" style="font-size:14px">First to ${prefs.rules.target} wins. House rules are under Rules.</span></div>
  </div>`;
}

/* ---------- table ---------- */
function posMap(n){ return n === 5 ? ['s','w','nw','ne','e'] : n === 4 ? ['s','w','n','e'] : n === 3 ? ['s','w','e'] : ['s','n']; }
function seatPos(seat){ const g = S.g; return posMap(g.n)[(seat - S.viewer + g.n) % g.n]; }

function tableView(){
  const g = S.g, cfg = S.cfg, v = S.viewer, t = g.trump;
  const cur = FF.currentSeat(g);
  const showLast = S.hold > Date.now() && g.lastTrick;
  const myTurn = cur === v && cfg.seats[v].human && !showLast && !S.handoff;

  // seats
  const bidOf = s => { if (g.phase !== 'bid' && g.bidder === s) return `<span class="chip gold">Bid ${g.bid}</span>`;
    if (g.phase === 'bid'){ const hs = g.bidding.history.filter(x => x.seat === s); const last = hs[hs.length-1];
      if (last) return last.type === 'pass' ? '<span class="chip">Pass</span>' : `<span class="chip gold">${last.type === 'hold' ? 'Holds ' : ''}${last.value}</span>`; }
    return ''; };
  let seats = '';
  for (let s = 0; s < g.n; s++){
    const p = seatPos(s);
    const tricks = g.tricksBySeat ? g.tricksBySeat[s] : 0;
    const nCards = g.hands[s].length;
    seats += `<div class="seat pos-${p} ${cur === s && g.phase !== 'handOver' && g.phase !== 'gameOver' ? 'active' : ''}">
      ${p !== 's' ? `<div class="backs" aria-label="${nCards} cards">${Array.from({length:Math.min(nCards,8)}, () => backHTML('tiny')).join('')}</div>` : ''}
      <span class="plate"><span class="dot" style="background:${teamColor(g.teams[s])}"></span><span class="nm">${esc(g.names[s])}</span></span>
      <span class="chips">${g.dealer === s ? '<span class="chip">Dealer</span>' : ''}${S.booked && S.booked[s] ? '<span class="chip gold">Booked</span>' : ''}${bidOf(s)}${g.phase === 'play' || showLast || g.phase === 'handOver' ? (tricks ? `<span class="chip">${tricks} trick${tricks>1?'s':''}</span>` : '') : ''}${g.phase === 'play' && g.drawCount[s] != null && g.tricks.length === 0 ? `<span class="chip">drew ${g.drawCount[s]}</span>` : ''}</span>
      ${(() => { const b = S.bubbles && S.bubbles[s]; return b && b.until > Date.now() ? `<div class="bubble ${p === 's' ? 'up' : 'down'} ${Date.now() - b.t < 350 ? 'new' : ''}">${esc(b.text)}</div>` : ''; })()}
    </div>`;
  }

  // center
  const trickCards = showLast ? g.lastTrick.plays : g.trick;
  const winSeat = showLast ? g.lastTrick.winner : -1;
  const slots = {n:'',s:'',w:'',e:'',nw:'',ne:''};
  trickCards.forEach(p => { slots[seatPos(p.seat)] = cardHTML(p.card, {trump: t && FF.isTrump(p.card, t), win: p.seat === winSeat}); });
  let mid = '';
  if (g.phase === 'bid') mid = `<div class="backs">${backHTML('mini')}${backHTML('mini')}${backHTML('mini')}</div><span>Kitty</span><span>High bid: <b style="color:var(--chalk)">${g.bidding.high || '—'}</b></span>`;
  else if (t) mid = `<div class="trumpbadge ${FF.RED[t]?'red':'blk'}" title="Trump">${SYM[t]}</div><span>Trump<br>${SNAME[t]}</span>`;
  else mid = `<span>${esc(g.names[g.bidder])} is naming trump</span>`;
  if (showLast) mid += `<span style="color:var(--gold);font-weight:700">${esc(g.names[winSeat])} wins</span>`;
  const center = `<div class="center"><div class="slot n">${slots.n}</div><div class="slot w">${slots.w}</div><div class="mid">${mid}</div><div class="slot e">${slots.e}</div><div class="slot s">${slots.s}</div><div class="slot nw">${slots.nw}</div><div class="slot ne">${slots.ne}</div></div>`;

  // my hand
  const hand = S.handoff ? [] : sortHand(g.hands[v], t);
  let legal = null;
  if (myTurn && g.phase === 'play') legal = FF.legalPlays(g.hands[v], g.trick, t, g.settings);
  const selecting = myTurn && (g.phase === 'kitty' || g.phase === 'draw');
  const hinted = S.hint && S.hint.action ? (S.hint.action.card ? [S.hint.action.card] : (S.hint.action.discards || [])) : [];
  const nh = hand.length;
  const cw = nh > 6 ? 'clamp(48px, 14vw, 78px)' : 'clamp(56px, 16vw, 86px)';
  const ov = nh > 6 ? 'calc(var(--cw) * -0.3)' : 'calc(var(--cw) * 0.08)';
  const handHTML = hand.map(c => cardHTML(c, {
    trump: t && FF.isTrump(c, t),
    act: (myTurn && g.phase === 'play') ? 'play' : selecting ? 'toggle' : null,
    dim: legal ? legal.indexOf(c) < 0 : false,
    sel: S.sel.indexOf(c) >= 0, hinted: hinted.indexOf(c) >= 0,
    kit: g.phase === 'kitty' && myTurn && (g.kittyCards || []).indexOf(c) >= 0
  })).join('');

  const ticker = g.log.slice(-3).filter(e => e.t !== 'play').slice(-2).map(describe).join(' ');
  const status = `<div class="status">${g.bidder >= 0 && g.phase !== 'bid' ? `<span class="chip gold">${esc(g.names[g.bidder])} bid ${g.bid}</span>` : ''}<span>Hand ${g.handNo}</span><span>${esc(g.names[g.dealer])} dealt</span></div>`;

  const ven = cfg.venue ? venueById(cfg.venue) : null;
  return `${topbar(`<button class="btn ghost small" data-act="go" data-to="rules">Rules</button>`)}
  <div class="game ${g.n === 5 ? 'five' : ''}">
    <div class="felt">
      ${ven ? signHTML(ven) : ''}
      ${status}
      <div class="table ${g.n === 2 ? 'two' : g.n === 5 ? 'five' : ''}">${seats}${center}</div>
      ${prefs.talk && S.narr ? `<div class="talk ${Date.now() - S.narrT < 400 ? 'new' : ''}" role="status"><span class="who">${cfg.venue ? 'From the rail' : 'Peanut gallery'}</span><span class="say">${esc(S.narr)}</span></div>` : ''}
      <div class="ticker">${ticker}</div>
      <div class="handwrap"><div class="hand" style="--cw:${cw};--ov:${ov}">${handHTML}</div></div>
      ${actionsView(myTurn, cur, showLast)}
    </div>
    ${padView()}
  </div>`;
}

function actionsView(myTurn, cur, showLast){
  const g = S.g, v = S.viewer;
  if (g.phase === 'handOver' || g.phase === 'gameOver') return '';
  if (!myTurn){
    const who = esc(g.names[cur]);
    const what = showLast ? 'Next trick coming up' : ({bid:`${who} is bidding`, trump:`${who} is naming trump`, kitty:`${who} is picking through the kitty`, draw:`${who} is drawing`, play:`${who} is thinking`})[g.phase];
    return `<div class="actions"><div class="waiting"><span class="dots">${what}</span></div></div>`;
  }
  const hintBtn = `<button class="btn ghost small" data-act="hint">${S.hint ? 'Hide hint' : 'Hint'}</button>`;
  const hintBox = S.hint ? `<div class="hintbox"><b>Coach</b><span>${esc(S.hint.text)}</span></div>` : '';
  let body = '';
  if (g.phase === 'bid'){
    const acts = FF.legalBidActions(g), b = g.bidding;
    const dealer = g.dealer === v;
    const sub = b.stage === 'duel' ? (dealer ? `${esc(g.names[b.challenger])} raised to ${b.high}. Hold, raise, or let it go.` : `${esc(g.names[g.dealer])} (dealer) is holding at ${b.high}. Raise or pass.`)
      : dealer ? (b.high ? `High bid is ${b.high} by ${esc(g.names[b.highBidder])}. ${g.settings.dealerHold ? 'As dealer you can hold it.' : 'You bid last: go higher or pass.'}` : (g.settings.allPass === 'dealerStuck' ? "Everyone passed. You've been bagged, so you must bid." : 'Everyone passed. Take it at 15 or pass the deal.'))
      : b.high ? `High bid is ${b.high} by ${esc(g.names[b.highBidder])}. Bid higher or pass; you get one chance.` : 'Nobody has bid yet. Bid 15 or more, or pass.';
    body = `<div class="prompt">Your bid</div><div class="sub">${sub}</div><div class="bidbtns">${acts.map(a =>
      `<button class="btn ${a.type==='pass'?'ghost':''}" data-act="bid" data-type="${a.type}" data-value="${a.value||''}">${a.type==='pass'?'Pass':a.type==='hold'?'Hold '+b.high:a.value}</button>`).join('')}</div>`;
  } else if (g.phase === 'trump'){
    body = `<div class="prompt">You won the bid at ${g.bid}. Name trump.</div><div class="sub">Then the 3 kitty cards join your hand. Toss what you don't want and you'll be dealt back up to 5.</div>
      <div class="suitbtns">${FF.SUITS.map(s => `<button class="suitbtn ${FF.RED[s]?'red':''}" data-act="trump" data-suit="${s}">${SYM[s]} ${SNAME[s]}</button>`).join('')}</div>`;
  } else if (g.phase === 'kitty'){
    const need = g.hands[v].length - 5, kit = g.kittyCards || [];
    const own = S.sel.filter(c => kit.indexOf(c) < 0).length, back = Math.max(0, S.sel.length - need);
    body = `<div class="prompt">Toss at least ${need}: ${S.sel.length} picked</div><div class="sub">The 3 kitty cards are marked. You can toss all of them and up to ${g.settings.maxDraw} of your own (${own} of ${g.settings.maxDraw} so far). Nobody sees what you throw away.</div>
      <div class="row"><button class="btn" data-act="kitty" ${S.sel.length < need ? 'disabled' : ''}>${S.sel.length < need ? 'Pick ' + (need - S.sel.length) + ' more' : 'Throw away ' + S.sel.length + (back ? ', get ' + back + ' new' : '')}</button></div>`;
  } else if (g.phase === 'draw'){
    const max = Math.min(g.settings.maxDraw, g.deck.length);
    body = `<div class="prompt">The draw: toss up to ${max}, get new cards</div><div class="sub">Tap the cards you want to replace.</div>
      <div class="row"><button class="btn" data-act="draw" ${S.sel.length > max ? 'disabled' : ''}>${S.sel.length ? 'Draw ' + S.sel.length : 'Keep all 5'}</button></div>`;
  } else if (g.phase === 'play'){
    const legal = FF.legalPlays(g.hands[v], g.trick, g.trump, g.settings);
    const lead = !g.trick.length;
    let sub = lead ? 'You lead. Any card is allowed.' : '';
    if (!lead){
      const led = g.trick[0].card;
      if (FF.isTrump(led, g.trump)){
        const hasT = g.hands[v].some(c => FF.isTrump(c, g.trump));
        sub = !hasT ? 'Trump was led and you have none, so play anything.' : legal.length === g.hands[v].length ? 'Trump was led, but your top trump outranks it: you may renege and play anything.' : 'Trump was led, so you must play a trump.';
      } else sub = g.settings.followSuit === 'free' ? 'An off-suit card was led. Play any card.' : 'Follow suit or play a trump if you can.';
    }
    body = `<div class="prompt">${lead ? 'Your lead' : 'Your turn'}: tap a card</div><div class="sub">${sub}</div>`;
  }
  const bookBtn = g.phase === 'play' && isBookedHand(v) && !(S.booked && S.booked[v]) ? `<button class="btn small" data-act="book">Announce: I'm booked</button>` : '';
  return `<div class="actions">${body}${hintBox}<div class="row">${bookBtn}${hintBtn}</div></div>`;
}

function padView(){
  const g = S.g, nt = g.nTeams;
  const cols = `grid-template-columns:repeat(${nt}, minmax(0,1fr))`;
  let cells = '';
  const th = g.settings.target - 30;
  for (let k = 0; k < nt; k++) cells += `<div class="hd"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${teamColor(k)};margin-right:5px"></span>${esc(teamName(k))}${g.scores[k] >= th ? '<span class="gr">On the green</span>' : ''}</div>`;
  const hist = g.results.slice(-9);
  hist.forEach((r, i) => {
    for (let k = 0; k < nt; k++){
      const last = i === hist.length - 1;
      const setHere = !r.made && g.teams[r.bidder] === k;
      cells += `<div class="v ${last ? '' : 'old'} ${setHere ? 'set' : ''}">${r.after[k]}${setHere ? ' ✗' : ''}</div>`;
    }
  });
  if (!hist.length) for (let k = 0; k < nt; k++) cells += `<div class="v cur">0</div>`;
  return `<aside class="pad" aria-label="Score pad"><h3>Score pad</h3><div class="padcols ${nt >= 4 ? 'many' : ''}" style="${cols}">${cells}</div>
    <div class="padnote">Game to ${g.settings.target}. ${g.settings.target - 30} or more is on the green. Crossed-out numbers are old totals; ✗ marks a set.</div></aside>`;
}

/* ---------- overlays ---------- */
function layerView(){
  let h = '';
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  if (S.screen !== 'table' || !S.g) return h;
  const g = S.g;
  if (S.arrival){
    const v = venueById(S.cfg.venue), i = S.cfg.tourStop, fresh = S.arrival.fresh; S.arrival.fresh = false;
    if (fresh) setTimeout(() => Sound.neon(), 900);
    return h + `<div class="overlay"><div class="paper"><div class="marquee">${signHTML(v, fresh ? 'on' : '')}</div>
      <div class="eyebrow">Stop ${i + 1} of 10 · ${diffLabel(v)}${tour.beaten[v.id] ? ' · beaten before' : ''}</div>
      <h2>${esc(venueLine(v))}</h2>
      <p class="soft">${i < VENUES.length - 1 ? 'Win the game to open ' + esc(VENUES[i + 1].name) + '.' : 'Win here and you have beaten every bar in the Valley.'} First to ${g.settings.target}.</p>
      ${triviaHTML(S.arrival.q, 'arrival')}
      <div class="row"><button class="btn paperbtn" data-act="seat">Take a seat</button></div></div></div>`;
  }
  if (S.handoff != null){
    const nm = esc(g.names[S.handoff]);
    return h + `<div class="overlay"><div class="paper" style="text-align:center;align-items:center"><div class="eyebrow">Pass the device</div><h2>${nm}'s turn</h2><p class="soft">Everyone else, look away. ${nm}, tap when you're ready to see your cards.</p><button class="btn paperbtn" data-act="reveal">I'm ${nm}, show my cards</button></div></div>`;
  }
  if ((g.phase === 'handOver' || g.phase === 'gameOver') && S.hold <= Date.now()){
    const r = g.result, bt = g.teams[r.bidder];
    let rows = '';
    for (let k = 0; k < g.nTeams; k++){
      rows += `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${teamColor(k)};margin-right:6px"></span>${esc(teamName(k))}${k === bt ? ' <span class="soft">(bid ' + r.bid + ')</span>' : ''}</td>
        <td>${r.tricksTeam[k]}</td><td>${g.teams[r.highTrumpTrickWinner] === k && r.highTrump ? L(r.highTrump) : ''}</td><td>${r.pts[k]}</td>
        <td class="${r.deltas[k] >= 0 ? 'pos' : 'neg'}">${r.deltas[k] >= 0 ? '+' : ''}${r.deltas[k]}</td><td><b>${r.after[k]}</b></td></tr>`;
    }
    const title = r.made ? `${esc(teamName(bt))} made ${r.bid}` : `${esc(teamName(bt))} went set`;
    const sub = r.made ? `They needed ${r.bid} and took ${r.pts[bt]}.` : `They needed ${r.bid} but took only ${r.pts[bt]}, so ${r.bid} comes off their score.`;
    const table = `<div class="tablewrap"><table class="res"><thead><tr><th>Side</th><th>Tricks</th><th>High trump</th><th>Points</th><th>Change</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    if (g.phase === 'gameOver'){
      const tv = S.cfg.tourStop != null ? VENUES[S.cfg.tourStop] : null;
      let tourBlock = '', tourBtns = '';
      if (tv){
        if (S.tourWon){
          tourBlock = `<div class="marquee">${signHTML(tv, 'on')}</div><p><b>You beat ${esc(tv.name)}.</b> ${S.unlocked ? esc(S.unlocked.name) + ' is now open.' : S.tourFinal ? 'That was the last stop. Every bar is yours: pick one under "Play at" for any game mode.' : ''}</p>`;
          const ni = S.cfg.tourStop + 1;
          if (ni < VENUES.length) tourBtns = `<button class="btn paperbtn" data-act="tourgo" data-i="${ni}">Next bar: ${esc(VENUES[ni].name)}</button>`;
        } else tourBlock = `<p><b>The regulars at ${esc(tv.name)} took this one.</b> Win a game here to open the next bar.</p>`;
      }
      const youWon = S.cfg.seats.some((s, i) => s.human && g.teams[i] === g.winner);
      return h + `<div class="overlay"><div class="paper"><div class="eyebrow">Game over · ${g.results.length} hands</div>
        <h2 class="result-title ${youWon ? 'made' : 'set'}">${esc(teamName(g.winner))} win${g.teams.filter(x => x === g.winner).length > 1 ? '' : 's'} ${g.scores[g.winner]} to ${Math.max.apply(null, g.scores.filter((_, k) => k !== g.winner))}${g.scores.filter((_, k) => k !== g.winner).some(x => x >= g.scores[g.winner]) ? ' (bidders win ties)' : ''}</h2>
        ${tourBlock}<p class="soft">Last hand: ${title}. ${sub}</p>${table}
        <p class="soft" style="font-size:14px">${S.cfg.practice ? 'Practice games are not counted in standings.' : 'Added to the standings on this device.'}</p>
        <div class="row">${tourBtns}<button class="btn ${tourBtns ? 'ghost' : 'paperbtn'}" data-act="again">${tv ? 'Rematch' : 'Play again'}</button>${tv ? '<button class="btn ghost" data-act="go" data-to="tour">All bars</button>' : ''}<button class="btn ghost" data-act="go" data-to="standings">Standings</button><button class="btn ghost" data-act="home">Menu</button></div></div></div>`;
    }
    return h + `<div class="overlay"><div class="paper"><div class="eyebrow">Hand ${g.handNo} · trump ${SNAME[r.trump]} ${SYM[r.trump]}</div>
      <h2 class="result-title ${r.made ? 'made' : 'set'}">${title}</h2><p class="soft">${sub} Each trick is 5, plus 5 for the highest trump played.</p>${table}
      ${S.handQ ? triviaHTML(S.handQ, 'hand') : ''}
      <div class="row"><button class="btn paperbtn" data-act="next">Deal next hand</button></div></div></div>`;
  }
  return h;
}

/* ---------- learn ---------- */
const LESSONS = ['The cards','Which card wins?','Bidding & the kitty','The draw','Playing & reneging','Renege drill','Scoring','Table lingo','Coached hand'];
function learnView(){
  const nav = LESSONS.map((t, i) => `<button class="${S.lesson === i ? 'on' : ''}" data-act="lesson" data-i="${i}"><i>${i + 1}</i>${t}</button>`).join('');
  return `${topbar()}<div class="lessons"><nav class="lnav" aria-label="Lessons">${nav}</nav><div class="paper lesson">${lessonBody(S.lesson)}
    <div class="row" style="margin-top:6px">${S.lesson > 0 ? `<button class="btn ghost" data-act="lesson" data-i="${S.lesson - 1}">Back</button>` : ''}${S.lesson < LESSONS.length - 1 ? `<button class="btn paperbtn" data-act="lesson" data-i="${S.lesson + 1}">Next: ${LESSONS[S.lesson + 1]}</button>` : ''}</div></div></div>`;
}
function rankRows(t){
  const rows = [`<div class="rankrow"><span class="lbl">Trump (${SNAME[t]}), highest to lowest</span><div class="cards">${FF.rankingFor(t, t).map(c => cardHTML(c, {size:'mini', trump:true})).join('')}</div></div>`];
  FF.SUITS.filter(s => s !== t).forEach(s => rows.push(`<div class="rankrow"><span class="lbl">${SNAME[s]} when not trump</span><div class="cards">${FF.rankingFor(s, t).map(c => cardHTML(c, {size:'mini'})).join('')}</div></div>`));
  return rows.join('');
}
function lessonBody(i){
  switch (i){
    case 0: return `<div class="eyebrow">Lesson 1</div><h2>The cards</h2>
      <p>Forty-Fives uses a regular 52-card deck, but the order of the cards changes with trump. Three cards are always on top:</p>
      <ul><li><span class="kbd">The 5 of trump</span> beats everything.</li><li><span class="kbd">The Jack of trump</span> is second.</li><li><span class="kbd">The Ace of Hearts</span> is third, and it is a trump no matter which suit is trump.</li></ul>
      <p>Then come the Ace, King and Queen of trump. After that, the old saying: <b>high in red, low in black</b>. In red suits the 10 beats the 2; in black suits the 2 beats the 10. Outside trump, the King is always the top card, and the Ace of Diamonds is the lowest diamond.</p>
      <div class="row"><span style="font-weight:700">Show trump as</span><span class="suitbtns">${FF.SUITS.map(s => `<button class="suitbtn ${FF.RED[s]?'red':''}" style="${S.rankTrump===s?'box-shadow:0 0 0 3px var(--ink)':''}" data-act="ranktrump" data-suit="${s}">${SYM[s]}</button>`).join('')}</span></div>
      ${rankRows(S.rankTrump)}`;
    case 1: return `<div class="eyebrow">Lesson 2 · drill</div><h2>Which card wins?</h2>
      <p>The first card played is the lead. Any trump beats any non-trump. If nobody plays a trump, the highest card of the suit that was led wins; other suits can't win.</p>${winDrillView()}`;
    case 2: return `<div class="eyebrow">Lesson 3</div><h2>Bidding &amp; the kitty</h2>
      <p>The dealer gives each player 3 cards, puts 3 face down in the middle as the <b>kitty</b>, then gives everyone 2 more.</p>
      <ul><li>Bidding starts left of the dealer and goes around once. Each player bids in fives from 15 to 30, or passes. Nobody says a suit while bidding.</li>
      <li>Every bid must be <b>higher</b> than the one before it. Nobody can match a bid, the dealer included. The dealer bids last.${prefs.rules.dealerHold ? ' Your table has switched on the dealer hold under house rules: the dealer may take the high bid at the same number, and the high bidder can then raise.' : ''}</li>
      <li>If everyone passes, the dealer is <b>bagged</b> and must bid at least 15.</li>
      <li>The winner names trump and picks up the kitty, holding 8 cards. They throw away face down: any or all of the kitty, plus up to ${prefs.rules.maxDraw} of their own cards, at least 3 in all. In their turn of the draw, the dealer deals them back up to 5.</li></ul>
      <div class="example"><b>Example.</b> Rita bids 15. Normand can't say 15 too, so he passes. Pauline bids 20. You're dealer, so you speak last: bid 25 or 30 to take it, or pass and Pauline has it at 20.</div>
      <p>What is a bid worth? Each trick is 5 points and the highest trump played is 5 more, so a hand has 30 points in it. Bid what you think your side will take.</p>`;
    case 3: return `<div class="eyebrow">Lesson 4</div><h2>The draw</h2>
      <p>After the bidder fixes up the kitty, each player in turn from the dealer's left throws away up to ${prefs.rules.maxDraw} cards, and the dealer replaces them from the deck. The bidder has already chosen, so on their turn the dealer just fills them back to 5.</p>
      <ul><li>Keep your trumps, and remember the Ace of Hearts counts as one.</li><li>Off-suit cards are weak. Under Merrimack Valley rules anyone can trump them, so most players toss them.</li><li>Holding three or more good trumps? You might stand pat.</li></ul>`;
    case 4: return `<div class="eyebrow">Lesson 5</div><h2>Playing &amp; reneging</h2>
      <p>The bidder leads the first trick; whoever wins a trick leads the next. There are five tricks.</p>
      <ul><li><b>When trump is led</b>, you must play a trump if you have one.</li>
      <li><b>The renege privilege:</b> the 5, the Jack and the Ace of Hearts may stay hidden when a <i>lower</i> trump is led. If those are your only trumps, you may play any card instead. If you also hold a lower trump, you must play a trump.</li>
      <li>You can never renege against a higher card. If the Jack is led, the 5 may renege but the Ace of Hearts may not.</li>
      <li><b>When an off-suit card is led</b>, Merrimack Valley rules let you play any card.${prefs.rules.followSuit === 'followOrTrump' ? ' Your table has switched on “follow suit or trump” under house rules.' : ''}</li></ul>
      <div class="example"><b>Example.</b> Spades are trump and the 6♠ is led. You hold 5♠, K♥ and 2♦. The 5♠ outranks the 6♠, so you may keep it and throw the 2♦.</div>`;
    case 5: return `<div class="eyebrow">Lesson 6 · drill</div><h2>Renege drill</h2><p>Trump has been led. Tap every card you are allowed to play, then check your answer.</p>${renegeDrillView()}`;
    case 6: return `<div class="eyebrow">Lesson 7</div><h2>Scoring</h2>
      <ul><li>Every trick is worth <b>5</b>. The side that wins the trick holding the <b>highest trump played</b> gets <b>5 more</b>. That's 30 points a hand.</li>
      <li>If the bidding side takes at least its bid, it scores everything it took.</li>
      <li>If it falls short, it goes <b>set</b>: the bid comes off its score, even below zero.</li>
      <li>The other side always scores what it took.</li>
      <li>First to <b>${prefs.rules.target}</b> wins. If both sides pass ${prefs.rules.target} on the same hand, the bidders win.</li></ul>
      <div class="example"><b>Example.</b> You bid 20 and take 3 tricks plus the highest trump: 15 + 5 = 20. You made it and score 20; the other side scores its 10. Had you bid 25, you'd lose 25 and they'd still score 10.</div>`;
    case 7: return `<div class="eyebrow">Lesson 8</div><h2>Table lingo</h2>
      <p>Sit down at a Merrimack Valley table and you'll hear these.</p>
      <ul><li><b>Bagging the dealer.</b> Everyone passes, so the dealer is forced to bid. "They bagged me again."</li>
      <li><b>Booked.</b> Every card in your hand is a trump. Some players announce it as a courtesy, so the others know they don't have a chance.</li>
      <li><b>On the green.</b> Your side has ${prefs.rules.target - 30} or more, so one more good hand can end the game.</li>
      <li><b>Set.</b> The bidders didn't take their bid, so it comes off their score.</li>
      <li><b>Renege.</b> Holding back the 5, Jack or Ace of Hearts when a lower trump is led.</li>
      <li><b>Kitty.</b> The 3 face-down cards the bidder picks up.</li></ul>`;
    case 8: return `<div class="eyebrow">Lesson 9</div><h2>Coached hand</h2>
      <p>Play a full game with Rita as your partner against Normand and Pauline. The coach suggests every move and explains why, and the suggested cards are outlined in gold. Practice games don't count toward standings.</p>
      <div class="row"><button class="btn paperbtn" data-act="coached">Start the coached game</button></div>`;
  }
}

/* drills */
function newWinQ(){
  const rng = Math.random, t = FF.SUITS[Math.floor(rng() * 4)];
  const deck = FF.shuffle(FF.newDeck(), rng);
  const trumps = deck.filter(c => FF.isTrump(c, t)), others = deck.filter(c => !FF.isTrump(c, t));
  const n = rng() < 0.5 ? 3 : 4;
  const led = rng() < 0.3 ? trumps[0] : others[0];
  const cards = [led];
  const used = new Set([led]);
  const pick = arr => { for (const c of arr) if (!used.has(c)){ used.add(c); return c; } };
  while (cards.length < n){
    const x = rng();
    let c;
    if (x < 0.45) c = pick(FF.shuffle(trumps.slice(), rng));
    else if (x < 0.8 && !FF.isTrump(led, t)) c = pick(FF.shuffle(others.filter(o => FF.suitOf(o) === FF.suitOf(led)), rng));
    else c = pick(FF.shuffle(others.slice(), rng));
    if (c) cards.push(c);
  }
  return {kind:'win', t, cards, answer:null, score:(S.drill && S.drill.kind === 'win' ? S.drill.score : 0), count:(S.drill && S.drill.kind === 'win' ? S.drill.count : 0)};
}
function winDrillView(){
  if (!S.drill || S.drill.kind !== 'win') S.drill = newWinQ();
  const d = S.drill, t = d.t;
  const plays = d.cards.map((c, i) => ({seat:i, card:c}));
  const wi = FF.trickWinnerIndex(plays, t), wc = d.cards[wi];
  let fb = '';
  if (d.answer != null){
    const right = d.answer === wc;
    const led = d.cards[0];
    const why = FF.isTrump(wc, t) ? (d.cards.filter(c => FF.isTrump(c, t)).length > 1 ? `${L(wc)} is the highest trump in the trick.` : `${L(wc)} is the only trump, and any trump beats any non-trump.`)
      : `No trumps were played, so the highest ${SNAME[FF.suitOf(led)].toLowerCase().replace(/s$/, '')} wins. ${FF.RED[FF.suitOf(led)] ? 'Red suits run high: K, Q, J, 10 down to 2, with the A♦ last.' : 'Black suits run low: K, Q, J, A, then 2 up to 10.'}`;
    fb = `<div class="feedback ${right ? 'ok' : 'no'}"><b>${right ? 'Right.' : 'Not quite.'}</b> ${why}</div><div class="row"><button class="btn paperbtn" data-act="winnext">Next question</button></div>`;
  }
  const cards = d.cards.map((c, i) => `<div>${cardHTML(c, {act: d.answer == null ? 'winpick' : null, trump: FF.isTrump(c, t), win: d.answer != null && c === wc, sel: false})}<div class="lab">${i === 0 ? 'Led' : 'Player ' + (i + 1)}</div></div>`).join('');
  return `<div class="drill"><div class="row" style="justify-content:space-between"><span>Trump is <b>${SNAME[t]} ${SYM[t]}</b>. Tap the card that wins.</span><span class="chip">${d.score} / ${d.count} right</span></div><div class="cards">${cards}</div></div>${fb}`;
}
function newRenegeQ(){
  const rng = Math.random, t = FF.SUITS[Math.floor(rng() * 4)];
  const trumps = FF.shuffle(FF.newDeck().filter(c => FF.isTrump(c, t)), rng);
  const lowTrumps = trumps.filter(c => FF.trumpRank(c, t) < 98);
  const led = lowTrumps[0];
  const used = new Set([led]);
  const hand = [];
  const lr = FF.trumpRank(led, t);
  const tops = trumps.filter(c => FF.isTop3(c, t) && !used.has(c));
  if (rng() < 0.8){ const c = tops[0]; hand.push(c); used.add(c); }
  if (rng() < 0.4){ const c = lowTrumps.find(x => !used.has(x)); hand.push(c); used.add(c); }
  const others = FF.shuffle(FF.newDeck().filter(c => !FF.isTrump(c, t)), rng);
  for (const c of others){ if (hand.length >= 4) break; hand.push(c); used.add(c); }
  return {kind:'renege', t, led, hand: sortHand(hand, t), picked:[], checked:false, score:(S.drill && S.drill.kind === 'renege' ? S.drill.score : 0), count:(S.drill && S.drill.kind === 'renege' ? S.drill.count : 0)};
}
function renegeDrillView(){
  if (!S.drill || S.drill.kind !== 'renege') S.drill = newRenegeQ();
  const d = S.drill, t = d.t;
  const legal = FF.legalPlays(d.hand, [{seat:0, card:d.led}], t, prefs.rules);
  let fb = '';
  if (d.checked){
    const right = legal.length === d.picked.length && legal.every(c => d.picked.indexOf(c) >= 0);
    const trumpsHeld = d.hand.filter(c => FF.isTrump(c, t));
    let why;
    if (!trumpsHeld.length) why = 'You hold no trumps, so any card is allowed.';
    else if (legal.length === d.hand.length) why = `Your only trump${trumpsHeld.length > 1 ? 's are' : ' is'} ${trumpsHeld.map(L).join(' and ')}, which outrank${trumpsHeld.length > 1 ? '' : 's'} the led ${L(d.led)}. That's the renege privilege: you may play any card.`;
    else if (trumpsHeld.some(c => FF.isTop3(c, t) && FF.trumpRank(c, t) > FF.trumpRank(d.led, t))) why = `You could renege your top trump, but you also hold a lower trump, so you must play a trump: ${legal.map(L).join(', ')}.`;
    else why = `Trump was led and you hold ${trumpsHeld.map(L).join(', ')}. You must play a trump.`;
    fb = `<div class="feedback ${right ? 'ok' : 'no'}"><b>${right ? 'Right.' : 'Not quite.'}</b> ${why}</div><div class="row"><button class="btn paperbtn" data-act="renegenext">Next question</button></div>`;
  }
  const hand = d.hand.map(c => cardHTML(c, {act: d.checked ? null : 'renegepick', trump: FF.isTrump(c, t), win: d.checked && legal.indexOf(c) >= 0, dim: d.checked && legal.indexOf(c) < 0})).join('');
  const picked = d.hand.map(c => d.picked.indexOf(c) >= 0 ? L(c) : null).filter(Boolean);
  return `<div class="drill"><div class="row" style="justify-content:space-between"><span>Trump is <b>${SNAME[t]} ${SYM[t]}</b>. The lead:</span><span class="chip">${d.score} / ${d.count} right</span></div>
    <div class="cards">${cardHTML(d.led, {trump:true})}</div><span>Your hand. Tap the cards you may play:</span>
    <div class="cards">${hand}</div><span>${d.checked ? '' : 'Picked: ' + (picked.length ? picked.join(', ') : 'none')}</span>
    ${d.checked ? '' : `<div class="row"><button class="btn" data-act="renegecheck" ${d.picked.length ? '' : 'disabled'}>Check</button></div>`}</div>${fb}`;
}

/* ---------- standings ---------- */
function standingsView(){
  const st = stand();
  const by = {};
  st.games.forEach(x => { const p = by[x.name] = by[x.name] || {name:x.name, games:0, wins:0, modes:{}, bids:0, made:0, sumBid:0, top:0};
    p.games++; if (x.won) p.wins++; const m = p.modes[x.mode] = p.modes[x.mode] || [0,0]; m[x.won ? 0 : 1]++; });
  st.bids.forEach(b => { const p = by[b.name] = by[b.name] || {name:b.name, games:0, wins:0, modes:{}, bids:0, made:0, sumBid:0, top:0};
    p.bids++; p.sumBid += b.bid; if (b.made){ p.made++; p.top = Math.max(p.top, b.bid); } });
  const players = Object.values(by).sort((a, b) => (b.wins / (b.games || 1)) - (a.wins / (a.games || 1)) || b.games - a.games);
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
  const wl = m => m ? `${m[0]}–${m[1]}` : '—';
  const rows = players.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${p.games}</td><td>${p.wins}</td><td>${pct(p.wins, p.games)}</td>
    <td>${wl(p.modes.solo)}</td><td>${wl(p.modes.h2h)}</td><td>${wl(p.modes.partners)}</td><td>${wl(p.modes.cutthroat)}</td>
    <td>${p.made}/${p.bids}</td><td>${p.bids ? (p.sumBid / p.bids).toFixed(1) : '—'}</td><td>${p.top || '—'}</td></tr>`).join('');
  const recent = st.games.slice(-10).reverse().map(x => `<tr><td>${new Date(x.t).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</td><td>${esc(x.name)}</td><td>${MODE_INFO[x.mode].title}</td>
    <td class="${x.won ? 'pos' : 'neg'}">${x.won ? 'Won' : 'Lost'}</td><td>${x.score}–${x.opp}</td><td>${x.hands}</td></tr>`).join('');
  return `${topbar()}<div class="paper" style="display:flex;flex-direction:column;gap:16px">
    <div><div class="eyebrow">Saved on this device</div><h2>Standings</h2><p class="soft" style="margin-top:4px">Night Out: ${VENUES.filter(v => tour.beaten[v.id]).length} of 10 bars beaten · Bar talk: ${tour.right} of ${tour.asked} right</p></div>
    ${players.length ? `<div class="tablewrap"><table class="res stand"><thead><tr><th>Player</th><th>Games</th><th>Wins</th><th>Win %</th><th>Solo</th><th>Head-to-Head</th><th>Partners</th><th>Cutthroat</th><th>Bids made</th><th>Avg bid</th><th>Top bid made</th></tr></thead><tbody>${rows}</tbody></table></div>
      <h3>Recent games</h3><div class="tablewrap"><table class="res"><thead><tr><th>Date</th><th>Player</th><th>Mode</th><th>Result</th><th>Score</th><th>Hands</th></tr></thead><tbody>${recent}</tbody></table></div>`
      : `<div class="empty">No games finished yet. Win or lose, every finished game shows up here, along with how often each player makes their bids.</div>`}
    <div class="row">${S.confirmReset ? `<span>Erase all standings on this device?</span><button class="btn paperbtn" data-act="resetyes">Erase</button><button class="btn ghost" data-act="resetno">Keep them</button>` : (players.length ? `<button class="btn ghost" data-act="reset">Reset standings</button>` : '')}</div>
  </div>`;
}

/* ---------- rules ---------- */
function rulesView(){
  const r = prefs.rules;
  const sel = (id, opts, val) => `<select id="${id}" data-bind="rule" data-k="${id}">${opts.map(o => `<option value="${o[0]}" ${String(val) === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const chk = (id, label, sub) => `<label class="check"><input type="checkbox" id="${id}" data-bind="rulecheck" data-k="${id}" ${r[id] ? 'checked' : ''}><span><b>${label}</b><br><span class="soft">${sub}</span></span></label>`;
  return `${topbar(S.g && S.g.phase !== 'gameOver' ? `<button class="btn small" data-act="back">Back to the game</button>` : '')}
  <div class="two-col">
    <div class="paper rules" style="display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow">Merrimack Valley rules</div><h2>How Forty-Fives is played</h2>
      <ul>
        <li><b>Deal.</b> 5 cards each, dealt 3 then 2, with 3 face down to the kitty in between.</li>
        <li><b>Rank.</b> Trump runs 5, J, A♥, A, K, Q, then high in red and low in black. The A♥ is always trump. Off-suit: K, Q, J, then red 10 to 2 with A♦ last, black A, 2 up to 10.</li>
        <li><b>Bid.</b> One bid each from the dealer's left, 15 to 30 in fives. Each bid must top the last one; nobody can match it, the dealer included. If everyone passes, the dealer is bagged and must bid. No suit is named until bidding ends.</li>
        <li><b>Kitty.</b> The winner names trump and takes the kitty. They may toss the whole kitty plus up to ${r.maxDraw} of their own cards (at least 3 in all), face down, and are dealt back to 5 in their turn of the draw.</li>
        <li><b>Draw.</b> Each player throws away up to ${r.maxDraw} and draws replacements.</li>
        <li><b>Play.</b> The bidder leads. Trump led means you play trump if you can; the 5, J and A♥ may renege against a lower trump. On an off-suit lead, any card may be played.</li>
        <li><b>Score.</b> 5 a trick, 5 for the highest trump. Make your bid and score all you took; miss and lose the bid. First to ${r.target}; bidders win ties.</li>
      </ul>
    </div>
    <div class="paper" style="display:flex;flex-direction:column;gap:14px">
      <div class="eyebrow">Your table</div><h2>House rules</h2><p class="soft" style="font-size:14px">Changes apply to the next game you start.</p>
      <div class="setgrid">
        <div class="field"><label for="followSuit">Off-suit lead</label>${sel('followSuit', [['free','Any card (Merrimack Valley)'],['followOrTrump','Follow suit or trump']], r.followSuit)}</div>
        <div class="field"><label for="allPass">Everyone passes</label>${sel('allPass', [['dealerStuck','Dealer is bagged and must bid'],['dealerChoice','Dealer may pass the deal']], r.allPass)}</div>
        <div class="field"><label for="leader">First lead</label>${sel('leader', [['bidder','Bidder leads'],['leftOfDealer','Left of dealer leads']], r.leader)}</div>
        <div class="field"><label for="maxDraw">Most cards in the draw</label>${sel('maxDraw', [[3,'3'],[4,'4'],[5,'5']], r.maxDraw)}</div>
        <div class="field"><label for="target">Game to</label>${sel('target', [[120,'120'],[100,'100'],[150,'150']], r.target)}</div>
        <div class="field"><label for="speed">Computer speed</label><select id="speed" data-bind="speed"><option value="slow" ${prefs.speed==='slow'?'selected':''}>Relaxed</option><option value="normal" ${prefs.speed==='normal'?'selected':''}>Normal</option><option value="fast" ${prefs.speed==='fast'?'selected':''}>Quick</option></select></div>
      </div>
      ${chk('dealerHold', 'Dealer may hold', 'The dealer can take the high bid at the same number; the high bidder may then raise.')}
      ${chk('thirtyForSixty', '30 for 60', 'A made bid of 30 scores 60.')}
      ${chk('mustBidOut', 'Must bid to go out', 'A side can only reach the winning score on its own bid.')}
      <div class="row"><button class="btn ghost" data-act="ruledefaults">Restore Merrimack Valley defaults</button></div>
      <h3 style="margin-top:6px">Table talk &amp; sound</h3>
      <label class="check"><input type="checkbox" id="ptalk" data-bind="talkcheck" ${prefs.talk ? 'checked' : ''}><span><b>Table talk</b><br><span class="soft">The regulars run their mouths and the peanut gallery chimes in.</span></span></label>
      <label class="check"><input type="checkbox" id="psound" data-bind="prefcheck" data-k="sound" ${prefs.sound ? 'checked' : ''}><span><b>Game sounds</b><br><span class="soft">Shuffling, cards hitting the felt, knocks for a pass, and more.</span></span></label>
      <div class="field"><label for="pvol">Game volume</label><input type="range" id="pvol" data-bind="volume" min="0" max="1" step="0.05" value="${prefs.volume}"></div>
      <label class="check"><input type="checkbox" id="pamb" data-bind="prefcheck" data-k="ambience" ${prefs.ambience ? 'checked' : ''}><span><b>Bar sounds</b><br><span class="soft">Each bar has its own room noise: voices you can't quite make out, glasses, bottles, footsteps, and a few sounds of its own.</span></span></label>
      <div class="field"><label for="pambvol">Bar volume</label><input type="range" id="pambvol" data-bind="ambvolume" min="0" max="1" step="0.05" value="${prefs.ambVolume}"></div>
    </div>
  </div>`;
}

/* ================= EVENTS ================= */
let toastTimer;
function toast(m){ S.toast = m; $layer.innerHTML = layerView(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; $layer.innerHTML = layerView(); }, 3200); }

document.addEventListener('click', e => {
  if (S.sndOpen && !e.target.closest('.sndpanel') && !e.target.closest('[data-act="sndpanel"]')) toggleSndPanel(false);
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, g = S.g;
  switch (a){
    case 'home': clearTimeout(S.timer); S.screen = 'home'; S.handoff = null; render(); break;
    case 'go': clearTimeout(S.timer); S.screen = el.dataset.to; S.confirmReset = false; render(); break;
    case 'back': S.screen = 'table'; advance(); break;
    case 'mode': openSetup(el.dataset.mode); break;
    case 'resume': resume(); break;
    case 'seathuman': S.setup.seats[+el.dataset.i].human = el.dataset.v === '1'; render(); break;
    case 'ctn': { const n = +el.dataset.v; const old = S.setup.seats; S.setup.n = n; S.setup.seats = defaultSeats('cutthroat', n).map((s, i) => old[i] || s); render(); break; }
    case 'startsetup': startGame({mode:S.setup.mode, n:S.setup.n, seats:S.setup.seats.map(s => Object.assign({}, s))}); break;
    case 'again': { const cfg = S.cfg; startGame({mode:cfg.mode, n:cfg.n, seats:cfg.seats, venue:cfg.venue, tourStop:cfg.tourStop}, {coach:cfg.coach, practice:cfg.practice, arrival:cfg.tourStop != null}); break; }
    case 'tourgo': startTour(+el.dataset.i); break;
    case 'seat': S.arrival = null; advance(); break;
    case 'triv': { const T = el.dataset.where === 'arrival' ? S.arrival.q : S.handQ; if (!T || T.pick != null) break;
      T.pick = +el.dataset.k; tour.asked++; if (T.opts[T.pick] === T.right){ tour.right++; Sound.right(); } else Sound.wrong(); saveTour(); render(); break; }
    case 'book': { const v = S.viewer; S.booked[v] = true; narrate('bookedYou', {name: S.g.names[v]});
      const o = S.g.teams.map((t, i) => i).filter(i => !S.cfg.seats[i].human && S.g.teams[i] !== S.g.teams[v]); if (o.length) say(o[Math.floor(Math.random() * o.length)], 'bookedGroan'); render(); break; }
    case 'sndpanel': toggleSndPanel(); break;
    case 'reveal': S.handoff = null; advance(); break;
    case 'next': S.hint = null; S.handQ = null; act({type:'next'}); break;
    case 'bid': act(el.dataset.type === 'bid' ? {type:'bid', value:+el.dataset.value} : {type:el.dataset.type}); break;
    case 'trump': act({type:'trump', suit:el.dataset.suit}); break;
    case 'toggle': { const c = el.dataset.card, i = S.sel.indexOf(c);
      if (i >= 0) S.sel.splice(i, 1);
      else if (g.phase === 'kitty'){ const kit = g.kittyCards || [], own = S.sel.filter(x => kit.indexOf(x) < 0).length;
        if (kit.indexOf(c) < 0 && own >= g.settings.maxDraw){ toast(`You can toss at most ${g.settings.maxDraw} of your own cards. The kitty cards can all go.`); break; }
        S.sel.push(c); }
      else { const lim = Math.min(g.settings.maxDraw, g.deck.length);
        if (S.sel.length >= lim){ toast(`You can draw at most ${lim}.`); break; }
        S.sel.push(c); }
      render(); break; }
    case 'kitty': act({type:'kitty', discards:S.sel.slice()}); break;
    case 'draw': act({type:'draw', discards:S.sel.slice()}); break;
    case 'play': { if (el.getAttribute('aria-disabled') === 'true'){ toast(g.trick.length && FF.isTrump(g.trick[0].card, g.trump) ? 'Trump was led, so you must play a trump.' : 'You must follow suit or trump.'); break; } act({type:'play', card:el.dataset.card}); break; }
    case 'hint': if (S.hint){ S.hint = null; render(); } else { S.hint = FF.hint(g, S.viewer, S.rng); render(); } break;
    case 'lesson': S.lesson = +el.dataset.i; S.drill = null; render(); window.scrollTo(0, 0); break;
    case 'ranktrump': S.rankTrump = el.dataset.suit; render(); break;
    case 'winpick': { const d = S.drill; d.answer = el.dataset.card; d.count++; const plays = d.cards.map((c, i) => ({seat:i, card:c})); if (d.cards[FF.trickWinnerIndex(plays, d.t)] === d.answer) d.score++; render(); break; }
    case 'winnext': S.drill = newWinQ(); render(); break;
    case 'renegepick': { const d = S.drill, c = el.dataset.card, i = d.picked.indexOf(c); if (i >= 0) d.picked.splice(i, 1); else d.picked.push(c); render(); break; }
    case 'renegecheck': { const d = S.drill; d.checked = true; d.count++; const legal = FF.legalPlays(d.hand, [{seat:0, card:d.led}], d.t, prefs.rules);
      if (legal.length === d.picked.length && legal.every(c => d.picked.indexOf(c) >= 0)) d.score++; render(); break; }
    case 'renegenext': S.drill = newRenegeQ(); render(); break;
    case 'coached': startGame({mode:'solo', n:4, venue:null, seats:[{name:prefs.name || 'You', human:true, level:'normal'},{name:'Normand', human:false, level:'normal'},{name:'Rita', human:false, level:'normal'},{name:'Pauline', human:false, level:'normal'}]}, {coach:true, practice:true, seed:4545, dealer:3}); break;
    case 'reset': S.confirmReset = true; render(); break;
    case 'resetno': S.confirmReset = false; render(); break;
    case 'resetyes': save('ff.standings', {games:[], bids:[]}); S.confirmReset = false; render(); toast('Standings erased.'); break;
    case 'ruledefaults': prefs.rules = Object.assign({}, RULE_DEFAULTS); savePrefs(); render(); toast('Merrimack Valley defaults restored.'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (b === 'level'){ prefs.level = el.value; savePrefs(); }
  else if (b === 'venue'){ prefs.venue = el.value; savePrefs(); }
  else if (b === 'seatlevel'){ S.setup.seats[+el.dataset.i].level = el.value; }
  else if (b === 'speed'){ prefs.speed = el.value; savePrefs(); }
  else if (b === 'rule'){ const k = el.dataset.k; prefs.rules[k] = (k === 'maxDraw' || k === 'target') ? +el.value : el.value; savePrefs(); }
  else if (b === 'rulecheck'){ prefs.rules[el.dataset.k] = el.checked; savePrefs(); }
  else if (b === 'prefcheck'){ prefs[el.dataset.k] = el.checked; savePrefs(); Sound.configure(prefs);
    document.querySelectorAll('[data-act="sndpanel"].iconbtn').forEach(x => x.innerHTML = (prefs.sound || prefs.ambience) ? SPEAKER_ON : SPEAKER_OFF);
    ['sp-sound','psound'].forEach(id => { const c = document.getElementById(id); if (c) c.checked = prefs.sound; });
    ['sp-amb','pamb'].forEach(id => { const c = document.getElementById(id); if (c) c.checked = prefs.ambience; });
    if (el.dataset.k === 'sound' && prefs.sound) Sound.bid(20); }
  else if (b === 'ambvolume'){ prefs.ambVolume = +el.value; savePrefs(); Sound.configure(prefs); }
  else if (b === 'talkcheck'){ prefs.talk = el.checked; savePrefs(); }
  else if (b === 'volume'){ prefs.volume = +el.value; savePrefs(); Sound.configure(prefs); Sound.bid(20); }
});
document.addEventListener('input', e => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (b === 'name'){ prefs.name = el.value.slice(0, 18); savePrefs(); }
  else if (b === 'seat'){ S.setup.seats[+el.dataset.i].name = el.value.slice(0, 18); }
});

render();
})();
</script>
